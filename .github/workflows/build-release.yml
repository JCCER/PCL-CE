name: Build & Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 2.15.2；留空则从 tag 名读取）'
        required: false
        type: string

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x64, ARM64]
      fail-fast: false
    env:
      LANG: en_US.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 11.0.x

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Write version into metadata.json
        shell: bash
        run: |
          python3 - "${VERSION}" <<'PY'
          import json, sys
          version = sys.argv[1]
          path = "Plain Craft Launcher 2/metadata.json"
          with open(path, encoding="utf-8") as f:
              data = json.load(f)
          data["version"]["base"] = version
          data["version"]["suffix"] = ""
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Publish
        env:
          PCL_WRITE_SECRET: '1'
          PCL_GITHUB_SHA: ${{ github.sha }}
          PCL_MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          PCL_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          dotnet publish "Plain Craft Launcher 2/Plain Craft Launcher 2.csproj" \
            -p:Configuration=Release -p:Platform=${{ matrix.arch }} \
            -p:DeleteExistingFiles=true -o ./artifact --no-self-contained

      - name: Package zip
        shell: bash
        run: |
          ARCH="${{ matrix.arch }}"
          if [ "$ARCH" = "ARM64" ]; then ARCH=arm64; else ARCH=x64; fi
          cd artifact
          zip -r "../PCL-CE-win-${ARCH}.zip" .
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PCL-CE-win-${{ matrix.arch }}
          path: PCL-CE-win-*.zip

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            TAG="v${{ inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ./dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          files: dist/*.zip
          generate_release_notes: true
