name: Sync Upstream

# 每天自动把上游 PCL-Community/PCL-CE 的 dev 合并到本 fork 的 dev。
# 若合并无冲突则直接推送到 dev；若发生冲突则自动开一个 PR 供人工解决。

permissions:
  contents: write
  pull-requests: write

on:
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 00:00 自动执行
  workflow_dispatch:       # 也可手动触发

jobs:
  sync:
    name: Sync upstream/dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync upstream/dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote add upstream https://github.com/PCL-Community/PCL-CE.git
          git fetch upstream dev
          git checkout dev

          if git merge upstream/dev --no-edit; then
            echo "::notice::merge clean, pushing to dev"
            git push origin dev
          else
            echo "::warning::merge conflict, opening a PR for manual resolution"
            git merge --abort
            BRANCH="sync/upstream-dev"
            git push origin upstream/dev:refs/heads/${BRANCH} --force
            gh pr create --base dev --head "${BRANCH}" \
              --title "Sync upstream/dev" \
              --body "自动同步上游 PCL-Community/PCL-CE 的 dev 分支时产生冲突，请在此 PR 中手动解决后合并。" \
              || echo "::notice::PR 可能已存在，跳过创建"
          fi
