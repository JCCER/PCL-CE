name: Build and Release PCL-CE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Windows x64 Release
    runs-on: windows-2022
    timeout-minutes: 45

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          dotnet restore "Plain Craft Launcher 2/Plain Craft Launcher 2.csproj"

      - name: Build Release x64
        shell: pwsh
        run: |
          dotnet build "Plain Craft Launcher 2/Plain Craft Launcher 2.csproj" `
            -c Release `
            -p:Platform=x64 `
            -p:RuntimeIdentifier=win-x64 `
            --no-restore

      - name: Publish release package
        shell: pwsh
        run: |
          $out = "artifacts/PCL-CE-${{ github.ref_name }}-win-x64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          dotnet publish "Plain Craft Launcher 2/Plain Craft Launcher 2.csproj" `
            -c Release `
            -p:Platform=x64 `
            -p:RuntimeIdentifier=win-x64 `
            --self-contained false `
            -o $out `
            --no-build

      - name: Zip publish output
        shell: pwsh
        run: |
          $source = "artifacts/PCL-CE-${{ github.ref_name }}-win-x64"
          $zip = "artifacts/PCL-CE-${{ github.ref_name }}-win-x64.zip"
          Compress-Archive -Path "$source\*" -DestinationPath $zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCL-CE-${{ github.ref_name }}-win-x64
          path: artifacts/*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PCL-CE ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.zip
